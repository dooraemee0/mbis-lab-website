<!-- illustrative topic graphic for the "Vision Transformers & Self-Supervised Learning" AI seminar -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
  <rect fill="#f7f8fa" x="0" y="0" width="1000" height="750" />

  <text x="500" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3b4a6b" font-weight="600">Vision Transformers</text>
  <text x="500" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#7c9cf5">&amp; Self-Supervised Learning</text>

  <!-- 4x4 image-patch grid -->
  <g transform="translate(300, 210)">
    <!-- attention lines from center patch to several others, drawn first so patches sit on top -->
    <g stroke="#7c9cf5" stroke-width="1.6" opacity="0.55">
      <line x1="205" y1="205" x2="25" y2="25" />
      <line x1="205" y1="205" x2="375" y2="25" />
      <line x1="205" y1="205" x2="25" y2="375" />
      <line x1="205" y1="205" x2="375" y2="375" />
      <line x1="205" y1="205" x2="205" y2="25" />
      <line x1="205" y1="205" x2="25" y2="205" />
      <line x1="205" y1="205" x2="375" y2="205" />
      <line x1="205" y1="205" x2="205" y2="375" />
    </g>

    <g stroke="#c7cedb" stroke-width="1.5" fill="#e5ecfb">
      <rect x="0" y="0" width="80" height="80" /><rect x="90" y="0" width="80" height="80" />
      <rect x="180" y="0" width="80" height="80" /><rect x="270" y="0" width="80" height="80" />
      <rect x="0" y="90" width="80" height="80" /><rect x="90" y="90" width="80" height="80" />
      <rect x="180" y="90" width="80" height="80" /><rect x="270" y="90" width="80" height="80" />
      <rect x="0" y="180" width="80" height="80" /><rect x="90" y="180" width="80" height="80" />
      <rect x="180" y="180" width="80" height="80" /><rect x="270" y="180" width="80" height="80" />
      <rect x="0" y="270" width="80" height="80" /><rect x="90" y="270" width="80" height="80" />
      <rect x="180" y="270" width="80" height="80" /><rect x="270" y="270" width="80" height="80" />
    </g>

    <!-- masked patches (self-supervised objective) -->
    <rect x="90" y="0" width="80" height="80" fill="#404040" />
    <rect x="270" y="90" width="80" height="80" fill="#404040" />
    <rect x="0" y="270" width="80" height="80" fill="#404040" />
    <g stroke="#808080" stroke-width="2">
      <path d="M 105 15 L 145 65 M 145 15 L 105 65" />
      <path d="M 285 105 L 325 155 M 325 105 L 285 155" />
      <path d="M 15 285 L 55 335 M 55 285 L 15 335" />
    </g>

    <!-- query / center patch highlighted -->
    <rect x="180" y="180" width="80" height="80" fill="#3b4a6b" />
    <circle cx="220" cy="220" r="10" fill="#f6c453" />
  </g>

  <text x="500" y="670" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9aa2b1">patch attention over masked image regions</text>
</svg>
