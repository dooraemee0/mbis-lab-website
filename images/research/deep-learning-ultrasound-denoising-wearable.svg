<!-- illustrative topic graphic for the "Deep Learning for Ultrasound Denoising and Wearable Monitoring" research card -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
  <rect fill="#f7f8fa" x="0" y="0" width="1000" height="750" />

  <text x="500" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#3b4a6b" font-weight="600">Ultrasound Denoising &amp; Wearable Monitoring</text>

  <!-- noisy -> attention -> clean strip -->
  <g transform="translate(120, 160)">
    <rect width="170" height="170" rx="8" fill="#1c1c1c" />
    <g fill="#7c9cf5" opacity="0.85">
      <circle cx="14" cy="18" r="2" /><circle cx="40" cy="60" r="2" /><circle cx="78" cy="12" r="2" /><circle cx="104" cy="52" r="2" />
      <circle cx="130" cy="22" r="2" /><circle cx="24" cy="94" r="2" /><circle cx="60" cy="118" r="2" /><circle cx="92" cy="90" r="2" />
      <circle cx="122" cy="112" r="2" /><circle cx="152" cy="70" r="2" /><circle cx="20" cy="140" r="2" /><circle cx="70" cy="150" r="2" />
      <circle cx="112" cy="144" r="2" /><circle cx="146" cy="130" r="2" /><circle cx="10" cy="54" r="2" /><circle cx="156" cy="36" r="2" />
    </g>
    <ellipse cx="85" cy="85" rx="42" ry="30" fill="none" stroke="#e5ecfb" stroke-width="2" opacity="0.5" />
    <text x="85" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9aa2b1">noisy scan</text>
  </g>

  <path d="M 320 245 L 372 245" stroke="#3b4a6b" stroke-width="3" marker-end="url(#a1)" />
  <g transform="translate(390, 165)">
    <rect width="150" height="160" rx="10" fill="#e5ecfb" stroke="#7c9cf5" stroke-width="2" />
    <text x="75" y="35" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600">self-attention</text>
    <g stroke="#7c9cf5" stroke-width="1.6" opacity="0.7">
      <line x1="30" y1="70" x2="120" y2="70" /><line x1="30" y1="100" x2="120" y2="100" /><line x1="30" y1="130" x2="120" y2="130" />
      <line x1="30" y1="70" x2="120" y2="130" /><line x1="30" y1="130" x2="120" y2="70" /><line x1="30" y1="100" x2="120" y2="70" />
      <line x1="30" y1="100" x2="120" y2="130" />
    </g>
    <g fill="#3b4a6b"><circle cx="30" cy="70" r="5" /><circle cx="30" cy="100" r="5" /><circle cx="30" cy="130" r="5" />
      <circle cx="120" cy="70" r="5" /><circle cx="120" cy="100" r="5" /><circle cx="120" cy="130" r="5" /></g>
  </g>

  <path d="M 555 245 L 607 245" stroke="#3b4a6b" stroke-width="3" marker-end="url(#a1)" />
  <g transform="translate(625, 160)">
    <rect width="170" height="170" rx="8" fill="#1c1c1c" />
    <ellipse cx="85" cy="85" rx="55" ry="38" fill="#2f3a55" />
    <ellipse cx="85" cy="85" rx="55" ry="38" fill="none" stroke="#7c9cf5" stroke-width="2" />
    <text x="85" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9aa2b1">denoised scan</text>
  </g>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#3b4a6b" />
    </marker>
  </defs>

  <!-- wearable bladder-monitoring device on body silhouette -->
  <g transform="translate(500, 470)">
    <path d="M -60 -140 C -90 -120, -95 -60, -80 0 C -70 60, -75 120, -60 160
             L 60 160 C 75 120, 70 60, 80 0 C 95 -60, 90 -120, 60 -140
             C 40 -160, -40 -160, -60 -140 Z"
          fill="#eef1f8" stroke="#c7cedb" stroke-width="2" />
    <rect x="-45" y="0" width="90" height="55" rx="10" fill="#3b4a6b" />
    <text x="0" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">wearable US</text>
    <path d="M -30 55 Q 0 90 30 55" fill="none" stroke="#e07856" stroke-width="2.5" stroke-dasharray="5 4" />
    <path d="M -22 62 Q 0 82 22 62" fill="none" stroke="#e07856" stroke-width="2.5" />
    <text x="120" y="70" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9aa2b1">coarse-to-fine</text>
    <text x="120" y="92" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9aa2b1">bladder shape estimation</text>
  </g>
</svg>
