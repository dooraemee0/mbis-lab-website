<!-- illustrative topic graphic for the "High-frequency Ultrasound Microbeam Technique" research card -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
  <rect fill="#f7f8fa" x="0" y="0" width="1000" height="750" />

  <text x="500" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3b4a6b" font-weight="600">High-Frequency Ultrasound Microbeam</text>
  <text x="500" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7c9cf5">Non-Contact Probing of Cell Mechanics</text>

  <!-- transducer emitting a tightly focused beam -->
  <g transform="translate(500, 190)">
    <rect x="-34" y="-40" width="68" height="60" rx="8" fill="#3b4a6b" />
    <path d="M -34 20 L -10 70 L 10 70 L 34 20 Z" fill="#3b4a6b" />
  </g>
  <path d="M 480 260 L 500 400 L 520 260 Z" fill="#7c9cf5" opacity="0.18" />
  <path d="M 480 260 L 500 400 M 520 260 L 500 400" stroke="#7c9cf5" stroke-width="2" stroke-dasharray="4 6" />

  <!-- cell monolayer (petri dish) -->
  <ellipse cx="500" cy="520" rx="330" ry="130" fill="#eef1f8" stroke="#c7cedb" stroke-width="2" />

  <!-- surrounding, unaffected cells -->
  <g fill="#dfe6f5" stroke="#b9c4dd" stroke-width="1.6">
    <ellipse cx="270" cy="470" rx="36" ry="26" /><ellipse cx="340" cy="540" rx="36" ry="26" />
    <ellipse cx="230" cy="550" rx="34" ry="24" /><ellipse cx="660" cy="470" rx="36" ry="26" />
    <ellipse cx="600" cy="545" rx="34" ry="24" /><ellipse cx="720" cy="545" rx="34" ry="24" />
    <ellipse cx="420" cy="590" rx="32" ry="22" /><ellipse cx="580" cy="595" rx="32" ry="22" />
  </g>

  <!-- targeted single cell responding: calcium signal + slight deformation -->
  <g transform="translate(500, 500)">
    <circle r="80" fill="#f7c9b0" opacity="0.5" />
    <circle r="55" fill="#f7c9b0" opacity="0.6" />
    <ellipse rx="40" ry="30" fill="#e07856" stroke="#b0472c" stroke-width="2" />
    <circle r="80" fill="none" stroke="#e07856" stroke-width="2" stroke-dasharray="3 5" />
  </g>

  <text x="500" y="700" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9aa2b1">mechanotransduction &amp; intracellular calcium signaling in a single targeted cell</text>
</svg>
