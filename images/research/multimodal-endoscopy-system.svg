<!-- illustrative topic graphic for the "Multimodal Endoscopy System" research card -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
  <rect fill="#f7f8fa" x="0" y="0" width="1000" height="750" />

  <!-- stomach outline -->
  <path d="M 560 250
           C 640 230, 720 260, 740 340
           C 760 420, 730 500, 650 540
           C 590 570, 520 560, 480 520
           C 440 560, 370 555, 350 505
           C 330 460, 355 415, 400 405
           C 380 370, 400 320, 450 305
           C 460 265, 520 245, 560 250 Z"
        fill="#f2f4fb" stroke="#3b4a6b" stroke-width="4" />

  <!-- lesion -->
  <circle cx="470" cy="450" r="26" fill="#e07856" opacity="0.85" />

  <!-- endoscope shaft entering from left -->
  <path d="M 60 470 C 200 470, 250 430, 330 430" fill="none" stroke="#3b4a6b" stroke-width="14" stroke-linecap="round" />
  <circle cx="345" cy="428" r="16" fill="#3b4a6b" />

  <!-- optical multispectral beam (colored fan) -->
  <path d="M 345 428 L 420 370 L 470 424 Z" fill="#7c9cf5" opacity="0.35" />
  <path d="M 345 428 L 420 370 M 345 428 L 470 424" stroke="#7c9cf5" stroke-width="2" stroke-dasharray="4 5" />

  <!-- high-frequency ultrasound beam (arcs) -->
  <g fill="none" stroke="#e07856" stroke-width="2.5">
    <path d="M 355 448 Q 400 460 430 480" />
    <path d="M 350 465 Q 400 485 445 505" />
    <path d="M 348 482 Q 395 505 460 525" />
  </g>

  <!-- 3D lesion topography inset -->
  <g transform="translate(700, 470)">
    <rect x="-90" y="-70" width="180" height="140" rx="10" fill="#ffffff" stroke="#c7cedb" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="65" ry="45" fill="none" stroke="#7c9cf5" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="none" stroke="#7c9cf5" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="24" ry="15" fill="none" stroke="#e07856" stroke-width="2.5" />
    <text x="0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9aa2b1">3D topography</text>
  </g>

  <text x="500" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3b4a6b" font-weight="600">Multimodal Endoscopy System</text>
  <text x="500" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7c9cf5">Optical-Multispectral + High-Frequency Ultrasound</text>
</svg>
